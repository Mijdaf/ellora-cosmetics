name: ellora_cosmetics
description: "Ellora Cosmetics — just a girl. A Flutter web storefront."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2        # product image upload in the admin dashboard
  supabase_flutter: ^2.8.0    # backend: admin auth + products/banners/orders
  url_launcher: ^6.3.1        # opens the wa.me link to notify the owner of new orders
  flutter_svg: ^2.0.10+1      # renders the real Instagram glyph (assets/icons/instagram.svg)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3   # generates the app/launcher/favicon icon from assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#5C1E42"   # espressoDeep (deep rose), matches the splash backdrop
    theme_color: "#EE7793"        # wheatGold (Ellora pink)
  image_path: assets/images/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true          # iOS rejects icons with transparency

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
